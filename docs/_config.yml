title: BatteryIncluded PHP SDK
description: Sync your catalog to BatteryIncluded and build search, suggestions and recommendations in PHP.
url: https://sdk.batteryincluded.eiling.io
theme: just-the-docs
plugins:
  - jekyll-polyglot

# english under /, german under /de/. A german page lives in de/ and has the permalink of its english counterpart
languages: ["en", "de"]
default_lang: "en"
# not copied to /de/, german pages link images with an absolute path
exclude_from_localization: ["CNAME", "llms.txt", "llms-full.txt", "assets/images"]
# config values per language, applied by _plugins/localize.rb
localized:
  de:
    description: Synchronisiere deinen Katalog mit BatteryIncluded und baue Suche, Vorschläge und Empfehlungen in PHP.
    gh_edit_link_text: Diese Seite auf GitHub bearbeiten

exclude: ["Gemfile", "Gemfile.lock", "vendor", ".jekyll-cache"]

color_scheme: eiling
# logo of the sidebar (variant of logo.svg for the dark background), without logo the title is shown as text
logo: /assets/images/logo-dark.svg
favicon_ico: /assets/images/favicon.png
search_enabled: true
heading_anchors: true

aux_links:
  GitHub: https://github.com/eiling-io/batteryincluded-php-sdk
  Packagist: https://packagist.org/packages/batteryincluded/batteryincluded-php-sdk
  API reference: https://www.postman.com/batteryincluded/core/overview
  eiling.io: https://eiling.io

gh_edit_link: true
gh_edit_link_text: Edit this page on GitHub
gh_edit_repository: https://github.com/eiling-io/batteryincluded-php-sdk
gh_edit_branch: main
gh_edit_source: docs
gh_edit_view_mode: edit


defaults:
  - scope:
      path: ""
    values:
      layout: default

callouts:
  note:
    title: Note
    color: blue
  important:
    title: Important
    color: yellow
  warning:
    title: Warning
    color: red
  # german pages
  hinweis:
    title: Hinweis
    color: blue
  wichtig:
    title: Wichtig
    color: yellow
  achtung:
    title: Achtung
    color: red
