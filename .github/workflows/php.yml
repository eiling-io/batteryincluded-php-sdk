name: ci

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]

jobs:
    test:
        strategy:
            max-parallel: 1
            matrix:
                php: ['8.2', '8.3', '8.4', '8.5']
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v2

            - uses: shivammathur/setup-php@v2
              with:
                php-version: ${{ matrix.php }}
                tools: composer
                coverage: none

            - name: Install dependencies
              run: composer install --prefer-dist --no-progress

            - name: run code php-cs-fixer
              run: ./tools/php-cs-fixer fix --config=.php-cs-fixer.php --dry-run

            - name: run phpstan
              run: ./tools/phpstan analyse -l 5 ./src

            - name: run tests
              run: ./vendor/bin/phpunit --stop-on-failure --stop-on-error
              env:
                  COLLECTION: ${{ secrets.COLLECTION }}
                  APIKEY: ${{ secrets.APIKEY }}

    # the live tests overwrite the collection with products only, restore the full demo data (products and blog posts)
    # at the end of every run, also when the tests failed
    sync-demo-data:
        name: restore demo data
        needs: test
        # forks have no access to the secrets
        if: ${{ !cancelled() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: shivammathur/setup-php@v2
              with:
                php-version: '8.4'
                tools: composer
                coverage: none

            - name: Install dependencies
              run: composer install --prefer-dist --no-progress

            - name: full sync of the demo data
              run: php tests/sync-demo-data.php
              env:
                  COLLECTION: ${{ secrets.COLLECTION }}
                  APIKEY: ${{ secrets.APIKEY }}
