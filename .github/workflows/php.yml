name: ci

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]

jobs:
    # code style and static analysis, runs without secrets
    quality:
        strategy:
            matrix:
                php: ['8.2', '8.3', '8.4', '8.5']
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: shivammathur/setup-php@v2
              with:
                php-version: ${{ matrix.php }}
                tools: composer
                coverage: none

            - name: Install dependencies
              run: composer install --prefer-dist --no-progress

            - name: run code php-cs-fixer
              run: ./tools/php-cs-fixer fix --config=.php-cs-fixer.php --dry-run

            - name: run phpstan
              run: ./tools/phpstan analyse -l 5 ./src

    # the tests talk to the live api, for pull requests the secrets of the environment `testing` are only handed out after
    # a maintainer approved the run (required reviewers of the environment). One job for all php versions, so one approval
    # per run. Pushes to main (merges) use the environment `testing-main`, it has no reviewers but is limited to the
    # branch main, otherwise nobody could approve the runs of the maintainer himself (prevent self-review).
    tests:
        name: tests (live api)
        needs: quality
        environment: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'testing-main' || 'testing' }}
        runs-on: ubuntu-latest
        env:
            COLLECTION: ${{ secrets.COLLECTION }}
            APIKEY: ${{ secrets.APIKEY }}

        steps:
            - uses: actions/checkout@v4

            # the php versions run one after another, they share the collection
            - uses: shivammathur/setup-php@v2
              with:
                php-version: '8.2'
                tools: composer
                coverage: none
            - name: run tests on php 8.2
              run: composer install --prefer-dist --no-progress && ./vendor/bin/phpunit --stop-on-failure --stop-on-error

            - uses: shivammathur/setup-php@v2
              with:
                php-version: '8.3'
                tools: composer
                coverage: none
            - name: run tests on php 8.3
              run: composer install --prefer-dist --no-progress && ./vendor/bin/phpunit --stop-on-failure --stop-on-error

            - uses: shivammathur/setup-php@v2
              with:
                php-version: '8.4'
                tools: composer
                coverage: none
            - name: run tests on php 8.4
              run: composer install --prefer-dist --no-progress && ./vendor/bin/phpunit --stop-on-failure --stop-on-error

            - uses: shivammathur/setup-php@v2
              with:
                php-version: '8.5'
                tools: composer
                coverage: none
            - name: run tests on php 8.5
              run: composer install --prefer-dist --no-progress && ./vendor/bin/phpunit --stop-on-failure --stop-on-error

            # the live tests overwrite the collection with products only, restore the full demo data (products and blog
            # posts) at the end of every run, also when the tests failed
            - name: restore demo data
              if: ${{ !cancelled() }}
              run: php tests/sync-demo-data.php
